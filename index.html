<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi app de estudio</title>

    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #333;
      }

      h1 {
        font-size: 34px;
        margin-bottom: 8px;
      }

      input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      textarea {
        height: 100px;
      }

      button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }

      select {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        background: white;
      }

      #filtros-materia {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      #filtros-materia button {
        margin-top: 0;
        padding: 6px 14px;
        background: #e5e7eb;
        color: #333;
        font-size: 13px;
      }

      #filtros-materia button:hover {
        background: #d1d5db;
      }

      #filtros-materia button.activo {
        background: #16a34a;
        color: white;
      }

      .etiqueta-materia {
        display: inline-block;
        background: #dcfce7;
        color: #15803d;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
    </style>

  </head>
  <body>

    <h1>Mi app pro</h1>
    <p>Organiza tus notas y estudia con inteligencia artificial.</p>

    <h2>Mis materias</h2>
    <ul>
      <li>Cálculo diferencial</li>
      <li>Termodinámica</li>
      <li>Programación</li>
      <li>Macroeconomía</li>
      <li>Calculo_1</li>
    </ul>
<!-- Formulario de autenticación -->
    <div id="seccion-auth">
      <h2>Entrar a tu cuenta</h2>
      
      <input type="email" id="input-email" placeholder="Tu email">
      <input type="password" id="input-password" placeholder="Tu contraseña">
      
      <button id="boton-registro">Crear cuenta</button>
      <button id="boton-login">Iniciar sesión</button>
    </div>

    <!-- Esta sección solo aparece cuando estás autenticado -->
    <div id="seccion-notas" style="display:none">
      <h2>Mis notas</h2>
      <button id="boton-cerrar-sesion" style="background:#dc2626;">Cerrar sesión</button>
    </div>
        <h2>Mis notas</h2>
    <div id="filtros-materia">
      <button class="activo" data-materia="">Todas</button>
      <button data-materia="Cálculo diferencial">Cálculo diferencial</button>
      <button data-materia="Termodinámica">Termodinámica</button>
      <button data-materia="Programación">Programación</button>
      <button data-materia="Física">Física</button>
    </div>
    <div id="lista-notas"></div>

    <h2>Nueva nota</h2>
    <select id="select-materia">
      <option value="Cálculo diferencial">Cálculo diferencial</option>
      <option value="Termodinámica">Termodinámica</option>
      <option value="Programación">Programación</option>
      <option value="Física">Física</option>
    </select>
    <input type="text" id="input-titulo" placeholder="Título de la nota">
    <textarea id="input-contenido" placeholder="Escribe tu nota aquí..."></textarea>
    <button id="boton-guardar">Guardar nota</button>

    <script type ="module" src="script.js"></script>
  </body>
</html>
