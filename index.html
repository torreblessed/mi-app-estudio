<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi app de estudio</title>

    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #333;
      }

      h1 {
        font-size: 38px;
        margin-bottom: 8px;
      }

      input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      textarea {
        height: 100px;
      }

      button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }
    </style>

  </head>
  <body>

    <h1>Mi app topada mega yetzing</h1>
    <p>Organiza tus notas y estudia con inteligencia artificial.</p>

    <h2>Mis materias</h2>
    <ul>
      <li>Cálculo diferencial</li>
      <li>Termodinámica</li>
      <li>Programación</li>
      <li>Macroeconomía</li>
      <li>Calculo_1</li>
    </ul>

    <h2>Nueva nota</h2>
    <input type="text" placeholder="Título de la nota">
    <textarea placeholder="Escribe tu nota aquí..."></textarea>
    <button>Guardar nota</button>

  </body>
</html>
